name: Draft prerelease
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag matches VERSION
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "v$(tr -d '\r\n' < VERSION)" == "$REF_NAME" ]]
          fi
      - run: python3 scripts/test-repository.py
      - run: bash scripts/test.sh
      - name: Build development package (not notarized)
        env:
          SIGN_MODE: adhoc
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iHotkey-draft-assets
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create draft only; human review required
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/*.dmg
            dist/SHA256SUMS
# Stable releases: replace ad-hoc assets with verified Developer ID notarized assets
# from scripts/release.sh before manually publishing. No credentials in this workflow.
