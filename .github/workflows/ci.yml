name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Repository checks
        run: python3 scripts/test-repository.py
      - name: Unit tests
        run: bash scripts/test.sh
      - name: Universal development package (no signing secrets)
        env:
          SIGN_MODE: adhoc
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iHotkey-${{ matrix.os }}-development
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
# No GUI/TCC claims: Actions runners do not replace old-system desktop testing.
